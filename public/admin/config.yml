# Sveltia CMS. Commits markdown straight to the repo, Vercel rebuilds on push.
# Sign in with a fine-grained GitHub token so there is no OAuth service to run.
backend:
  name: github
  repo: the-koinophobe/koinophobe-site
  branch: main
  commit_messages:
    create: 'note: add {{slug}}'
    update: 'note: update {{slug}}'
    delete: 'note: remove {{slug}}'

site_url: https://koinophobe.com
display_url: https://koinophobe.com
publish_mode: simple

# Leading slashes force these to resolve from the repo root. Without them a
# collection that sets `path` resolves media relative to the entry file, which
# is how an upload ended up in content/notes where nothing is ever served.
media_folder: /public/notes/figures
public_folder: /notes/figures

collections:
  - name: notes
    label: Notes
    label_singular: Note
    folder: content/notes
    media_folder: /public/notes/figures
    public_folder: /notes/figures
    create: true
    delete: true
    slug: '{{fields.slug}}'
    identifier_field: title
    path: '{{slug}}'
    extension: md
    format: yaml-frontmatter
    summary: '{{title}}'
    sortable_fields: [date, title]
    view_groups:
      - label: Status
        field: draft
    fields:
      - { name: title, label: Title, widget: string, hint: 'Written for a person, not a search engine.' }
      - {
          name: slug,
          label: URL slug,
          widget: string,
          pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Lowercase words separated by hyphens.'],
          hint: 'Becomes koinophobe.com/notes/your-slug. Do not change it after publishing.',
        }
      - {
          name: date,
          label: Publish date,
          widget: datetime,
          date_format: 'YYYY-MM-DD',
          time_format: false,
          picker_utc: true,
          hint: 'A future date holds the note back until that day.',
        }
      - {
          name: draft,
          label: Draft,
          widget: boolean,
          default: true,
          hint: 'On means nobody but you can see it. Turn it off to publish.',
        }
      - {
          name: excerpt,
          label: Excerpt,
          widget: text,
          required: true,
          hint: 'One or two sentences. Used on the notes index, in the meta description and in link previews.',
        }
      - {
          name: seo_title,
          label: SEO title (optional),
          widget: string,
          required: false,
          hint: 'Shorter title for Google and link previews. Keep it under 47 characters; " · Koinophobe" is added after it.',
        }
      - {
          name: cover,
          label: Cover illustration (optional),
          widget: image,
          required: false,
          hint: 'Used for link previews and the article image Google sees. 1600 x 900 works best.',
        }
      - {
          name: faq,
          label: Questions (optional),
          label_singular: Question,
          widget: list,
          required: false,
          collapsed: true,
          summary: '{{fields.q}}',
          hint: 'Shown under the note as Questions and sent to Google as FAQPage schema. Two to four is plenty. Answers must match what the note says.',
          fields: [
            { name: q, label: Question, widget: string },
            { name: a, label: Answer, widget: text },
          ],
        }
      - { name: body, label: Body, widget: markdown }
